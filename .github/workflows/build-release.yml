name: Build AutoCF 1.0.0 release candidates

on:
  workflow_dispatch:
  push:
    branches:
      - "release/1.0.0-cross-platform"
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  AUTOCF_VERSION: "1.0.0"
  RUNTIME_ASSET_TAG: "runtime-assets-1.0.0"
  RUNTIME_ASSET_NAME: "AutoCF-runtime-assets-1.0.0.zip"

jobs:
  desktop:
    name: ${{ matrix.name }}
    if: ${{ !contains(github.event.head_commit.message, '[docker-only]') && !contains(github.event.head_commit.message, '[docs-only]') && !contains(github.event.head_commit.message, '[macos-rc3-only]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            artifact: AutoCF-1.0.0-Windows-x64
            command: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_windows.ps1 -Version 1.0.0
            path: dist/AutoCF-1.0.0-Windows-x64.zip
          - name: Linux x64
            os: ubuntu-24.04
            artifact: AutoCF-1.0.0-Linux-x64
            command: bash packaging/build_linux.sh
            path: dist/AutoCF-1.0.0-Linux-x64.tar.gz
          - name: macOS Apple Silicon
            os: macos-15
            artifact: AutoCF-1.0.0-macOS-arm64
            command: bash packaging/build_macos.sh
            path: dist/AutoCF-1.0.0-macOS-arm64.dmg
          - name: macOS Intel
            os: macos-15-intel
            artifact: AutoCF-1.0.0-macOS-x64
            command: bash packaging/build_macos.sh
            path: dist/AutoCF-1.0.0-macOS-x64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Restore managed scientific runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p windows/runtime
          gh release download "$RUNTIME_ASSET_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RUNTIME_ASSET_NAME" --dir .
          python packaging/runtime_assets.py extract "$RUNTIME_ASSET_NAME" windows/runtime
          python packaging/runtime_assets.py verify windows/runtime

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb zstd libegl1 libgl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libnss3 libasound2t64 libdbus-1-3 libfontconfig1

      - name: Test release packaging contract
        shell: bash
        run: python -m unittest tests.test_release_packaging -v

      - name: Configure Apple Developer signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" ]]; then
            echo "Apple certificate secret is not configured; producing an ad-hoc-signed tester DMG."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/autocf-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/autocf-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials autocf-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo "APPLE_NOTARY_PROFILE=autocf-notary" >> "$GITHUB_ENV"

      - name: Build and smoke-test native package
        shell: bash
        env:
          AUTOCF_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ${{ matrix.command }}

      - name: Verify release artifact
        shell: bash
        run: python packaging/verify_release.py "${{ matrix.path }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.path }}
            ${{ matrix.path }}.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Attach to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ matrix.path }}" "${{ matrix.path }}.sha256" --clobber

  docker:
    name: Docker amd64 runtime
    if: ${{ !contains(github.event.head_commit.message, '[docs-only]') && !contains(github.event.head_commit.message, '[macos-rc3-only]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore managed scientific runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p windows/runtime
          gh release download "$RUNTIME_ASSET_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RUNTIME_ASSET_NAME" --dir .
          python packaging/runtime_assets.py extract "$RUNTIME_ASSET_NAME" windows/runtime
          python packaging/runtime_assets.py verify windows/runtime
      - name: Build and smoke-test image
        env:
          AUTOCF_DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/autocf-runtime:1.0.0
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          bash packaging/build_docker.sh
      - name: Publish Docker image for a version tag
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release/1.0.0-cross-platform'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository_owner }}/autocf-runtime:1.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCF-Runtime-1.0.0-amd64-offline
          path: |
            dist/AutoCF-Runtime-1.0.0-amd64.tar.zst
            dist/AutoCF-Runtime-1.0.0-amd64.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
