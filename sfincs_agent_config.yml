# AutoCF / SFINCS Agent canonical case configuration.
# Normal users edit ONLY this file (or a small `extends:` overlay).
# Backend URLs, units, provider defaults, and legacy HydroMT/SFINCS aliases are
# centralized in sfincs_config.py and are not repeated here.

schema_version: 2

project:
  workspace_root: /scratch/gpfs/NLIN/sradfar/simulations/sfincs
  run_name: tampa_helene_2024
  output_dir: auto
  cache_dir: auto
  overwrite: false

geometry:
  path: /scratch/gpfs/NLIN/sradfar/simulations/sfincs/sfincs_agent/tampa_helene_boundary.geojson

simulation:
  event_name: Helene_2024
  start: "2024-09-22T00:00:00Z"
  end: "2024-09-28T00:12:00Z"
  time_zone: UTC

model:
  mode: regular
  dx_m: 200
  crs: utm
  rotated: false

  # Single source of truth for the model vertical reference. Topobathy,
  # NOAA ocean forcing, NOAA validation, and HWM datum checks inherit it.
  vertical_datum: MSL

  # Built-in defaults: CUDEM + GEBCO topobathy, ESA WorldCover roughness.
  # Add model.topobathy or model.roughness ONLY when overriding a default.

  infiltration:
    enabled: false

forcing:
  precipitation:
    source: aorc            # era5 | aorc | mrms | file | none
  wind:
    source: aorc            # era5 | aorc | file | none
  pressure:
    source: aorc            # era5 | aorc | file | none

  ocean:
    source: noaa_coops      # noaa_coops | file | constant
    max_station_distance_km: 150

  river:
    source: usgs_auto       # usgs_auto | usgs_sites | file | none
    max_gage_distance_km: 50

validation:
  strict: false

  # Production hydraulic validation only. Auto prefers NOAA, then global
  # GESLA-4.1, UHSLC/JASL Research Quality, then UHSLC Fast Delivery. SAR/remote-sensing
  # flood-extent products are intentionally excluded.
  water_level:
    enabled: true
    provider: auto          # auto | noaa_coops | gesla | uhslc_rq | uhslc_fast | file
    provider_order: [noaa_coops, gesla, uhslc_rq, uhslc_fast]
    search_radius_km: 150
    max_stations: 12
    min_stations: 1
    max_missing_fraction: 0.20

    # Auto = absolute validation when a station datum matches model.vertical_datum;
    # otherwise freeze one offset from the initial alignment window and score
    # only the event after that window.
    datum_mode: auto
    datum_alignment_window_hours: [0, 12]
    exclude_alignment_window_from_scores: true

    # File mode example:
    # locations: /path/to/stations.geojson
    # timeseries: /path/to/observations.csv

  hwm:
    enabled: true
    provider: usgs_stn      # usgs_stn | file
    datum_policy: require_match
    vertical_datum_offset_m: null
    # path: /path/to/high_water_marks.geojson

analysis:
  enabled: true

  attribution:
    enabled: true
    drivers: [coastal, precipitation, river]

    # Excluded drivers are returned to a pre-event neutral background, not fit
    # to event observations. Coastal = ocean-boundary variability + wind + pressure.
    quiet_window_hours: [0, 12]
    off_baseline:
      coastal_boundary: quiet_median
      river: quiet_median

    # 0.05 m is retained as a thin-water sensitivity case. Publication/default
    # figures use the primary thresholds so shallow numerical wetting does not
    # compress the physically more consequential results.
    # Reporting thresholds are defined once. Thresholds below
    # primary_min_depth_m remain available as sensitivity diagnostics.
    depth_thresholds_m: [0.05, 0.10, 0.25, 0.50, 1.00, 2.00]
    primary_min_depth_m: 0.10

    compound_amplification:
      # Report meaningful amplification areas instead of only A > 0, which can
      # be dominated by millimetric differences over a large domain.
      absolute_thresholds_m: [0.01, 0.05, 0.10, 0.25]
      relative_thresholds: [0.05, 0.10, 0.25]
      relative_min_full_depth_m: 0.10

  # One shared static-land mask for hazard-area, building, and population
  # analysis. WorldCover class 80 excludes permanent/open water. The NONE
  # counterfactual is used to correct event depth, not to remove land cells.
  land_mask:
    enabled: true
    required: false
    worldcover_water_classes: [80]
    min_land_fraction: 0.50

  exposure:
    enabled: true

    # Default publication metric:
    # delta_h = max(H_scenario - H_NONE, 0)
    # SFINCS dry-depth NaN on active cells is interpreted as 0 m.
    # This removes persistent/background model water while preserving every
    # static-land cell in the exposure universe.
    depth_definition: excess_over_none

    buildings:
      enabled: true
      source: overture
      required: false

    population:
      enabled: true
      source: worldpop
      year: auto
      resolution: 100m
      polygon_simplify_m: 50
      task_timeout_seconds: 600
      max_parallel_tasks: 4
      # Oversized/fragmented polygons are automatically compacted and
      # partitioned into disjoint WorldPop requests if HTTP 413 occurs.

runtime:
  # The established hydraulic core is retained. AutoCF writes an internal
  # resolved legacy YAML and calls it; users never maintain duplicate settings.
  core_agent: ./sfincs_hydraulic_core.py
  evaluator: ./sfincs_eval.py
  attribution_script: ./sfincs_attribution.py

  sfincs:
    executable: /scratch/gpfs/NLIN/sradfar/software/sfincs/gpu/bin/sfincs


# -----------------------------------------------------------------------------
# Visualization
# -----------------------------------------------------------------------------
# Semantic colors are fixed in code so every AutoCF analysis figure uses the
# same visual language.
visualization:
  colors:
    compound: red
    coastal: blue
    precipitation: orange
    river: green
