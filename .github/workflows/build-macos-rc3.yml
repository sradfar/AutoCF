name: Build sanitized AutoCF macOS RC3

on:
  workflow_dispatch:
  push:
    branches:
      - "release/1.0.0-cross-platform"

permissions:
  contents: read

env:
  AUTOCF_VERSION: "1.0.0-rc3"
  RUNTIME_ASSET_TAG: "runtime-assets-1.0.0"
  RUNTIME_ASSET_NAME: "AutoCF-runtime-assets-1.0.0.zip"

jobs:
  macos:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[macos-rc3-only]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon RC3
            os: macos-15
            arch: arm64
          - name: macOS Intel RC3
            os: macos-15-intel
            arch: x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Restore managed scientific runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p windows/runtime
          gh release download "$RUNTIME_ASSET_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RUNTIME_ASSET_NAME" --dir .
          python packaging/runtime_assets.py extract "$RUNTIME_ASSET_NAME" windows/runtime
          python packaging/runtime_assets.py verify windows/runtime
      - name: Test RC3 source and sanitization contract
        shell: bash
        run: |
          python -m unittest tests.test_macos_sanitized_release -v
      - name: Build and verify native sanitized DMG
        shell: bash
        run: bash packaging/build_macos_rc3.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCF-1.0.0-rc3-macOS-${{ matrix.arch }}
          path: |
            dist-macos-rc3/AutoCF-1.0.0-rc3-macOS-${{ matrix.arch }}.dmg
            dist-macos-rc3/AutoCF-1.0.0-rc3-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          compression-level: 0
