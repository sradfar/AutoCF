name: Build portable AutoCF NVIDIA runtime

on:
  workflow_dispatch:
  push:
    branches:
      - portable-runtime-v1
    paths:
      - "container/**"
      - "tests/portable/**"
      - ".github/workflows/build-portable-runtime.yml"
      - "autocf.py"
      - "sfincs_*.py"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/autocf-nvidia

jobs:
  protected-source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/portable/test_protected_source_hashes.py

  build:
    needs: protected-source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_LC=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free runner disk space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          echo "=== AFTER CLEANUP ==="
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LC }}:portable-v1-candidate
            ${{ env.IMAGE_LC }}:${{ github.sha }}

      - name: Runtime compatibility tests
        run: |
          docker pull "${IMAGE_LC}:portable-v1-candidate"
          docker run --rm --entrypoint /usr/local/bin/autocf-entrypoint \
            "${IMAGE_LC}:portable-v1-candidate" \
            python /opt/autocf/tests/portable/test_runtime.py

      - name: Doctor
        run: |
          docker run --rm --entrypoint /usr/local/bin/autocf-entrypoint \
            "${IMAGE_LC}:portable-v1-candidate" \
            python /opt/autocf/doctor.py

      - name: Print candidate
        run: |
          echo "Candidate OCI image:"
          echo "${IMAGE_LC}:portable-v1-candidate"
          echo
          echo "Do NOT promote to portable-v1 until the SAME image passes"
          echo "tests/portable/gpu_acceptance.sh on both Della and the second HPC."
